<!DOCTYPE html>
<html lang="es">

<head>

  <title>Notas</title>
</head>

<body>

  <!--
    EDITA TUS ESCRITOS AQUÍ.

    Instrucciones:
    1. Cada nota debe ser un <article class="nota">.
    2. Cambia data-id, data-date, el título y el contenido.
    3. La fecha debe ir en formato AAAA-MM-DD, por ejemplo 2024-04-10.
    4. Guarda este archivo como notas.html en la misma carpeta que index.html.
  -->

  <article class="nota" data-id="1" data-date="2024-04-10">
    <h2>Prueba 1</h2>
    <div class="contenido">
      <p>miau.</p>
      <p>Pssjj.</p>
    </div>
  </article>

  <article class="nota" data-id="2" data-date="2024-04-11">

    <div class="contenido">
      <p>miauauau.</p>
    </div>
  </article>

  <article class="nota" data-id="3" data-date="2024-04-12">
    <h2>Prueba 3</h2>
    <div class="contenido">
      <p>Emsnd.</p>
    </div>
  </article>

</body>

</html>
