<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>esteticarelacional</title>
  <link
    href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Special+Elite&family=Courier+Prime:ital@0;1&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <!-- HIDDEN AUDIO ELEMENT — persiste entre ventanas -->
  <!-- ═══════════════════════════════════════════════════════════════
     AUDIO: el iPod carga archivos desde tu ordenador vía FileReader.
     Si quieres poner una URL de audio fija, cambia audio.src aquí:
     <audio id="player" src="https://tu-url.com/cancion.mp3"></audio>
     ═══════════════════════════════════════════════════════════════ -->
  <audio id="player"></audio>

  <!-- BOOT -->
  <div id="boot">
    <h1>Bienvenidx!</h1>
    <p>Cargando escritorio...</p>
    <div class="boot-bar">
      <div class="boot-fill"></div>
    </div>
  </div>

  <div id="desktop">
    <div id="menubar">
      <span id="menubar-title">Mac de Lucía</span>
      <span id="clock"></span>
    </div>

    <!-- ═══════════════════════════════════════════════════════════
       ICONOS DE ESCRITORIO — posiciones absolutas (top/left)
       Para cambiar un emoji por imagen, dentro de .dsk-icon-img
       sustituye el span por:
       <img src="ruta/icono.png" style="width:48px;height:48px;border-radius:10px;object-fit:cover"/>
       ═══════════════════════════════════════════════════════════ -->

    <!-- Icono: Mis Escritos -->
    <div class="dsk-icon" style="top:52px;left:28px" onclick="openWin('win-entries')">
      <div class="dsk-icon-img"><img src="img/notas.png"
          style="width:48px;height:48px;border-radius:10px;object-fit:cover" /></div>
      <!-- IMAGEN: sustituye 📖 por <img src="iconos/escritos.png" style="width:48px;height:48px;border-radius:10px;object-fit:cover"/> -->
      <span class="dsk-icon-lbl">Notas</span>
    </div>

    <!-- Icono: Buscador -->
    <div class="dsk-icon" style="top:160px;left:90px" onclick="openWin('win-search')">
      <div class="dsk-icon-img"><img src="img/safari.png"
          style="width:48px;height:48px;border-radius:10px;object-fit:cover" /></div>
      <!-- IMAGEN: sustituye 🔍 por <img src="iconos/buscar.png" style="width:48px;height:48px;border-radius:10px;object-fit:cover"/> -->
      <span class="dsk-icon-lbl">Buscador</span>
    </div>

    <!-- Icono: Calendario -->
    <div class="dsk-icon" style="top:257px;left:150px" onclick="openWin('win-cal')">
      <div class="dsk-icon-img"><img src="img/calendario.png"
          style="width:48px;height:48px;border-radius:10px;object-fit:cover" /></div>
      <!-- IMAGEN: sustituye 📅 por <img src="iconos/calendario.png" style="width:48px;height:48px;border-radius:10px;object-fit:cover"/> -->
      <span class="dsk-icon-lbl">Calendario</span>
    </div>

    <!-- Icono: iPod -->
    <div class="dsk-icon" style="top:270px;left:22px" onclick="openWin('win-ipod')">
      <div class="dsk-icon-img"><img src="img/musica.png"
          style="width:48px;height:48px;border-radius:10px;object-fit:cover" /></div>
      <!-- IMAGEN: sustituye 🎵 por <img src="iconos/ipod.png" style="width:48px;height:48px;border-radius:10px;object-fit:cover"/> -->
      <span class="dsk-icon-lbl">iPod</span>
    </div>

    <!-- Icono: Galería -->
    <div class="dsk-icon" style="top:393px;left:155px" onclick="openWin('win-gallery')">
      <div class="dsk-icon-img"><img src="img/galeria.png"
          style="width:48px;height:48px;border-radius:10px;object-fit:cover" /></div>
      <!-- IMAGEN: sustituye 🖼️ por <img src="img/galeria-icono.png" style="width:48px;height:48px;border-radius:10px;object-fit:cover"/> -->
      <span class="dsk-icon-lbl">Galería</span>
    </div>


    <!-- WIN: MIS ESCRITOS -->
    <div class="win open" id="win-entries" style="width:360px;height:440px;top:60px;left:140px;">
      <div class="wbar">
        <div class="wdot r" onclick="closeWin('win-entries')"></div>
        <div class="wdot y"></div>
        <div class="wdot g" onclick="closeWin('win-entries')"></div>
        <span class="wtitle">Mi diario</span>
      </div>
      <div class="wbody" id="wbody-entries"></div>
      <div class="wresize"></div>
    </div>

    <!-- WIN: LECTOR -->
    <div class="win" id="win-reader" style="width:400px;height:460px;top:80px;left:220px;">
      <div class="wbar">
        <div class="wdot r" onclick="closeWin('win-reader')"></div>
        <div class="wdot y"></div>
        <div class="wdot g"></div>
        <span class="wtitle">📄 Lectura</span>
      </div>
      <div class="wbody" id="wbody-reader"></div>
      <div class="wresize"></div>
    </div>

    <!-- WIN: BUSCADOR -->
    <div class="win" id="win-search" style="width:320px;height:380px;top:55px;left:520px;">
      <div class="wbar">
        <div class="wdot r" onclick="closeWin('win-search')"></div>
        <div class="wdot y"></div>
        <div class="wdot g"></div>
        <span class="wtitle">🔍 Buscador</span>
      </div>
      <div class="wbody">
        <input class="sinput" id="sinput" placeholder="Buscar en escritos…" oninput="doSearch()" />
        <div id="search-res"></div>
      </div>
      <div class="wresize"></div>
    </div>

    <!-- WIN: CALENDARIO -->
    <div class="win" id="win-cal" style="width:310px;height:460px;top:70px;left:360px;">
      <div class="wbar">
        <div class="wdot r" onclick="closeWin('win-cal')"></div>
        <div class="wdot y"></div>
        <div class="wdot g"></div>
        <span class="wtitle">📅 Calendario</span>
      </div>
      <div class="wbody">
        <div class="cal-nav">
          <button class="cal-arrow" onclick="calMove(-1)">‹</button>
          <span class="cal-month-lbl" id="cal-month-lbl"></span>
          <button class="cal-arrow" onclick="calMove(1)">›</button>
        </div>
        <div class="cal-grid" id="cal-grid"></div>
        <div id="cal-res"></div>
      </div>
      <div class="wresize"></div>
    </div>

    <!-- WIN: iPOD -->
    <div class="win" id="win-ipod" style="width:240px;height:430px;top:55px;left:600px;">
      <div class="wbar">
        <div class="wdot r" onclick="closeWin('win-ipod')"></div>
        <div class="wdot y"></div>
        <div class="wdot g"></div>
        <span class="wtitle">iPod</span>
      </div>
      <div class="wbody" id="wbody-ipod">
        <div class="ipod-shell">
          <div class="ipod-screen">
            <div class="ipod-title-bar">
              <span class="ipod-brand">iPod</span>
              <span class="ipod-battery" id="ipod-bat">▮▮▮</span>
            </div>
            <div id="ipod-screen-content"></div>
          </div>
          <!-- click wheel -->
          <div class="cwheel">
            <span class="cwheel-btn cw-top" onclick="ipodAction('menu')">MENU</span>
            <span class="cwheel-btn cw-bot" onclick="ipodAction('play')">▶⏸</span>
            <span class="cwheel-btn cw-lft" onclick="ipodAction('prev')">⏮</span>
            <span class="cwheel-btn cw-rgt" onclick="ipodAction('next')">⏭</span>
            <div class="cwheel-center" onclick="ipodAction('select')">OK</div>
          </div>
        </div>
      </div>
    </div>

    <!-- WIN: MURO MYSPACE -->
    <div class="win" id="win-wall" style="width:360px;height:460px;top:62px;left:440px;">
      <div class="wbar">
        <div class="wdot r" onclick="closeWin('win-wall')"></div>
        <div class="wdot y"></div>
        <div class="wdot g"></div>
        <span class="wtitle" style="font-family:'Comic Sans MS',cursive;color:#ffccee;">💌 Mi Muro</span>
      </div>
      <div class="wbody" id="wbody-wall">
        <div class="wall-h">✨ ¡Deja tu huella! ✨</div>
        <div class="wall-sub">— firma el muro y deja un mensaje 4ever —</div>
        <div class="wall-form">
          <input id="wall-name" placeholder="Tu nombre o alias xD" maxlength="40" />
          <textarea id="wall-msg" placeholder="Escribe tu mensaje ☆*:.｡.o(≧▽≦)o.｡.:*☆" maxlength="300"></textarea>
          <button class="wall-btn" onclick="postWall()">💾 Publicar en el muro</button>
        </div>
        <div id="wall-posts"></div>
      </div>
    </div>

    <!-- WIN: GALERÍA -->
    <div class="win" id="win-gallery" style="width:520px;height:440px;top:82px;left:300px;">
      <div class="wbar">
        <div class="wdot r" onclick="closeWin('win-gallery')"></div>
        <div class="wdot y"></div>
        <div class="wdot g"></div>
        <span class="wtitle">🖼️ Galería</span>
      </div>
      <div class="wbody" id="wbody-gallery"></div>
      <div class="wresize"></div>
    </div>
    <!-- DOCK -->
    <div id="dock">
      <a class="dicon" href="https://www.instagram.com/esteticarelacional/" target="_blank" rel="noopener noreferrer"
        aria-label="Abrir Instagram @esteticarelacional">
        <div class="dicon-em ig-icon" aria-hidden="true"></div>
        <span class="dicon-lbl">@esteticarelacional</span>
      </a>
      <a class="dicon" href="https://www.instagram.com/luxtequiero/" target="_blank" rel="noopener noreferrer"
        aria-label="Abrir Instagram @luxtequiero">
        <div class="dicon-em ig-icon" aria-hidden="true"></div>
        <span class="dicon-lbl">@luxtequiero</span>
      </a>
      <div class="dicon" onclick="openWin('win-wall')">
        <div class="dicon-em">💌</div>
        <span class="dicon-lbl">Muro</span>
      </div>
    </div>
  </div>
  <div id="gallery-lightbox" onclick="closeGalleryLightbox(event)">
    <button class="gallery-close" type="button" onclick="closeGalleryLightbox(event)">×</button>
    <img id="gallery-lightbox-img" src="" alt="" />
    <div class="gallery-lightbox-caption">
      <div id="gallery-lightbox-title"></div>
      <div id="gallery-lightbox-desc"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
